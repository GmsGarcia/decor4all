# CI for Decor4All. Orders the checks so the cheapest and most specific gate runs first (the diff gate needs no JDK and takes ~1s).
name: build
on: [pull_request, push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diff common trees
        run: |
          diff -r \
            --exclude=pack.mcmeta \
            --exclude=decor4all.classtweaker \
            --exclude=CarpenterTableRecipe.java \
            --exclude=mixin \
            --exclude=decor4all.mixins.json \
            versions/1.21.11/common/src/main versions/26.1/common/src/main
          diff -r --exclude=pack.mcmeta versions/26.1/common/src/main versions/26.2/common/src/main
          # 26.3's sanctioned divergences are the twelve BlockBehaviour-codec/axe
          # overrides plus pack.mcmeta: 26.3's own API dropped codec()/AxeItem.
          # The 26.3 tree otherwise matches 26.1, so this exclude list is the
          # complete 26.1↔26.3 difference set.
          diff -r \
            --exclude=pack.mcmeta \
            --exclude=AxeStoringSeatBlock.java \
            --exclude=CabinetCounterBlock.java \
            --exclude=CarpenterTableBlock.java \
            --exclude=ChairBlock.java \
            --exclude=CounterBlock.java \
            --exclude=DrawerCounterBlock.java \
            --exclude=HighBenchBlock.java \
            --exclude=LogBench2Block.java \
            --exclude=LogBenchBlock.java \
            --exclude=LogFenceBlock.java \
            --exclude=LogTableBlock.java \
            --exclude=SmallStoolBlock.java \
            versions/26.1/common/src/main versions/26.3/common/src/main
          # The generator lives in its own source set (src/generator), so it is
          # gated separately from src/main. Its trees are byte-identical across
          # all four versions.
          diff -r versions/1.21.11/common/src/generator versions/26.1/common/src/generator
          diff -r versions/26.1/common/src/generator versions/26.2/common/src/generator
          diff -r versions/26.1/common/src/generator versions/26.3/common/src/generator
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - run: ./gradlew prismDoctor # proves the 8 projects are wired right
      - uses: actions/upload-artifact@v4
        with:
          path: |
            versions/*/*/build/libs/*.jar
            !**/*-dev.jar
            !**/*-sources.jar
          if-no-files-found: error # a build that produces 0 jars must FAIL